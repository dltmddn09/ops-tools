<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CD 공지 검색</title>
<style>
  :root {
    --bg: #faf9f6; --text: #1c1b19; --sub: #6b6860; --faint: #a19d94;
    --rule: #e3e0d9; --rule-strong: #1c1b19; --accent: #8e1c1c;
    --mark: #fbe9a6; --hover: #f2f0ea; --body-bg: #f4f2ec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1918; --text: #e6e3dc; --sub: #9c988f; --faint: #6d6a63;
      --rule: #34322e; --rule-strong: #e6e3dc; --accent: #e07a6a;
      --mark: #5a4a14; --hover: #22211f; --body-bg: #211f1d;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    background: var(--bg); color: var(--text);
    font-size: 14px; line-height: 1.6;
    padding: 48px 20px 80px;
  }
  .wrap { max-width: 920px; margin: 0 auto; }
  a { color: inherit; }

  header {
    display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
    padding-bottom: 10px; border-bottom: 2px solid var(--rule-strong);
  }
  h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
  .head-r { display: flex; align-items: baseline; gap: 18px; }
  .meta { font-size: 12px; color: var(--sub); }
  .head-r { align-items: center; }
  #lang {
    font: inherit; font-size: 13px; font-weight: 600; color: var(--text); background: var(--bg);
    border: 1px solid var(--rule-strong); border-radius: 3px; padding: 4px 8px; line-height: 1.4; cursor: pointer;
  }
  #lang:hover { background: var(--hover); }

  .search { margin: 22px 0 18px; }
  #q {
    width: 100%; font: inherit; font-size: 17px; color: var(--text);
    background: transparent; border: none; border-bottom: 1px solid var(--rule);
    padding: 8px 2px; border-radius: 0;
  }
  #q:focus { outline: none; border-bottom-color: var(--text); }
  #q::placeholder { color: var(--faint); }

  .bar {
    display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
    border-bottom: 1px solid var(--rule); font-size: 13px;
  }
  .tabs { display: flex; gap: 20px; }
  .tab {
    background: none; border: none; font: inherit; color: var(--sub); cursor: pointer;
    padding: 8px 0; margin-bottom: -1px; border-bottom: 2px solid transparent;
  }
  .tab:hover { color: var(--text); }
  .tab.on { color: var(--text); font-weight: 600; border-bottom-color: var(--text); }
  .tab .n { color: var(--faint); font-weight: 400; margin-left: 3px; font-size: 12px; }
  .sort { background: none; border: none; font: inherit; font-size: 12px; color: var(--sub); cursor: pointer; }
  .sort:hover { color: var(--text); }

  .summary { font-size: 12px; color: var(--sub); padding: 12px 0 4px; }

  .post { border-bottom: 1px solid var(--rule); }
  .row {
    display: grid; grid-template-columns: 118px 64px 1fr auto; gap: 12px; align-items: baseline;
    padding: 11px 4px; cursor: pointer;
  }
  .row:hover { background: var(--hover); }
  .date { font-size: 12px; color: var(--sub); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .cat { font-size: 12px; color: var(--sub); }
  .cat.upd { color: var(--accent); }
  .title { font-weight: 600; }
  .src { font-size: 12px; color: var(--faint); text-decoration: none; }
  .src:hover { color: var(--text); text-decoration: underline; }

  .hits { padding: 0 4px 10px calc(118px + 12px + 4px); }
  .hit { display: flex; gap: 10px; padding: 2px 0; cursor: pointer; font-size: 13px; }
  .hit:hover .line { text-decoration: underline; text-decoration-color: var(--faint); }
  .sec { flex-shrink: 0; width: 64px; color: var(--faint); font-size: 12px; padding-top: 1px;
         overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .line { color: var(--text); word-break: keep-all; overflow-wrap: anywhere; }
  .more { font-size: 12px; color: var(--faint); padding-top: 2px; }
  mark { background: var(--mark); color: inherit; padding: 0 1px; }

  .body {
    display: none; margin: 0 4px 14px calc(118px + 12px + 4px);
    padding: 14px 18px; background: var(--body-bg); border-left: 2px solid var(--rule-strong);
    font-size: 13px; line-height: 1.75;
  }
  .post.open .body { display: block; }
  .body h2 { font-size: 14px; font-weight: 700; margin: 18px 0 4px; }
  .body h3 { font-size: 13px; font-weight: 700; margin: 12px 0 2px; color: var(--sub); }
  .body > :first-child { margin-top: 0; }
  .body li { margin-left: 16px; }
  .body li.d1 { margin-left: 32px; } .body li.d2 { margin-left: 48px; } .body li.d3 { margin-left: 64px; }
  .body a { text-decoration: underline; text-decoration-color: var(--faint); }
  .body table { border-collapse: collapse; margin: 8px 0; }
  .body td { border: 1px solid var(--rule); padding: 3px 10px; }
  .flash { background: var(--mark); transition: background 1.2s; }

  .empty { color: var(--sub); padding: 48px 0; text-align: center; font-size: 13px; }
  footer { margin-top: 32px; font-size: 12px; color: var(--faint); line-height: 1.8; }

  @media (max-width: 680px) {
    body { padding: 28px 16px 60px; }
    header { flex-direction: column; gap: 2px; }
    .head-r { width: 100%; justify-content: space-between; }
    .row { grid-template-columns: auto 1fr auto; row-gap: 0; }
    .row .date { grid-column: 1; } .row .cat { grid-column: 2; } .row .src { grid-column: 3; }
    .row .title { grid-column: 1 / -1; order: 5; }
    .hits, .body { padding-left: 4px; margin-left: 4px; }
    .body { padding-left: 14px; }
    .hit { flex-direction: column; gap: 0; }
    .sec { width: auto; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 data-t="title">CD 공지 검색</h1>
    <div class="head-r">
      <span class="meta" id="meta"></span>
      <select id="lang" aria-label="Language"></select>
    </div>
  </header>

  <div class="search">
    <input id="q" type="search" autocomplete="off" autofocus>
  </div>

  <div class="bar">
    <div class="tabs">
      <button class="tab on" data-cat=""><span data-t="all">전체</span><span class="n" data-count=""></span></button>
      <button class="tab" data-cat="업데이트"><span data-t="upd">업데이트</span><span class="n" data-count="업데이트"></span></button>
      <button class="tab" data-cat="공지사항"><span data-t="ntc">공지사항</span><span class="n" data-count="공지사항"></span></button>
    </div>
    <button class="sort" id="sort"></button>
  </div>

  <div class="summary" id="summary"></div>
  <div id="list"></div>

  <footer id="foot"></footer>
</div>

<script>
(function () {
  const SITE = 'https://crimsondesert.pearlabyss.com';
  const MAX_HITS = 8;
  // 언어 이름은 공식 홈페이지 언어 선택 메뉴 표기 그대로
  const LANGS = [
    ['ko-KR', '한국어'], ['en-US', 'English'], ['zh-CN', '简体中文'], ['zh-TW', '繁體中文'],
    ['ja-JP', '日本語'], ['de-DE', 'Deutsch'], ['fr-FR', 'Français'], ['es-ES', 'Español (España)'],
    ['es-MX', 'Español (LATAM)'], ['it-IT', 'Italiano'], ['pl-PL', 'Polski'], ['pt-BR', 'Português (Brasil)'],
    ['ru-RU', 'Русский'], ['tr-TR', 'TÜRKÇE'],
  ];
  // 예전 주소(#lang=en)·저장값 호환
  const ALIAS = { ko: 'ko-KR', en: 'en-US', zh: 'zh-CN' };
  const SHORT = { 'en-US': 'en', 'zh-CN': 'zh' };
  // 화면 문구는 한국어·영어·간체만 있고, 나머지 언어는 영어 문구를 쓴다. 업데이트·공지사항 탭 이름은 공홈 표기를 수집해 쓴다
  const T = {
    'ko-KR': {
      title: 'CD 공지 검색', all: '전체', upd: '업데이트', ntc: '공지사항',
      placeholder: '검색어를 입력하세요', desc: '최신순', asc: '오래된순', src: '원문',
      meta: (latest, checked) => `매주 월요일 10:30 자동 수집${checked ? ` · 마지막 갱신 ${checked}` : ''} · 최신 글 ${latest}`,
      sumAll: n => `${n}개 글`, sumHit: (n, h) => `${n}개 글, ${h}줄`,
      empty: '일치하는 내용이 없습니다.', noData: '데이터를 불러오지 못했습니다.',
      more: n => `외 ${n}줄 — 제목을 눌러 전문 보기`, img: '[이미지]',
      orig: '공식 홈페이지 표기',
      foot: loc => `출처: <a href="${SITE}/${loc}/News/Notice" target="_blank">붉은사막 공식 홈페이지 새소식</a> (게시판 목록에 공개된 글만 수집)<br>게시 시간은 한국 시간 기준입니다. 공식 홈페이지에는 UTC로 표기됩니다.`,
    },
    'en-US': {
      title: 'CD Notice Search', all: 'All', upd: 'Updates', ntc: 'Notices',
      placeholder: 'Search', desc: 'Newest', asc: 'Oldest', src: 'Source',
      meta: (latest, checked) => `Collected every Monday 10:30 KST${checked ? ` · Last refreshed ${checked}` : ''} · Latest ${latest}`,
      sumAll: n => `${n} post${n === 1 ? '' : 's'}`,
      sumHit: (n, h) => `${n} post${n === 1 ? '' : 's'}, ${h} line${h === 1 ? '' : 's'}`,
      empty: 'No matches.', noData: 'Failed to load data.',
      more: n => `${n} more line${n === 1 ? '' : 's'} — click the title for the full post`, img: '[image]',
      orig: 'Official site',
      foot: loc => `Source: <a href="${SITE}/${loc}/News/Notice" target="_blank">Crimson Desert official site — News</a> (only posts listed on the board)<br>Times are shown in KST (UTC+9). The official site shows UTC.`,
    },
    'zh-CN': {
      title: 'CD 公告搜索', all: '全部', upd: '更新信息', ntc: '公告',
      placeholder: '输入搜索词', desc: '最新', asc: '最早', src: '原文',
      meta: (latest, checked) => `每周一 10:30 自动收集${checked ? ` · 最后更新 ${checked}` : ''} · 最新 ${latest}`,
      sumAll: n => `${n} 篇`, sumHit: (n, h) => `${n} 篇，${h} 行`,
      empty: '没有匹配的内容。', noData: '数据加载失败。',
      more: n => `另有 ${n} 行 — 点击标题查看全文`, img: '[图片]',
      orig: '官网标示',
      foot: loc => `来源：<a href="${SITE}/${loc}/News/Notice" target="_blank">红色沙漠官网 新消息</a>（仅收集公告板列表中公开的帖子）<br>发布时间以韩国时间（UTC+9）显示。官网以 UTC 标示。`,
    },
  };
  const CAT_KEY = { '업데이트': 'upd', '공지사항': 'ntc' };
  const pad = n => String(n).padStart(2, '0');
  const tr = () => T[state.lang] || T['en-US'];

  // ---- 언어별 데이터 파일을 처음 고를 때 불러온다
  const loaded = {};
  function load(loc) {
    if (!loaded[loc]) loaded[loc] = new Promise(resolve => {
      const s = document.createElement('script');
      s.src = `data/${loc}.js`;
      s.onload = () => {
        const d = window.NOTICE_DATA && window.NOTICE_DATA[loc];
        if (d) d.posts.forEach(prep);
        resolve(d || null);
      };
      s.onerror = () => { delete loaded[loc]; resolve(null); };
      document.head.appendChild(s);
    });
    return loaded[loc];
  }
  let data = null;  // 지금 언어의 { lang, cats, posts }

  // ---- 전처리: 본문을 줄 단위로 나누고 각 줄의 소제목을 기억
  function prep(p) {
    const d = new Date(p.utc);
    const k = new Date(d.getTime() + 9 * 3600 * 1000);
    p.kst = `${k.getUTCFullYear()}.${pad(k.getUTCMonth() + 1)}.${pad(k.getUTCDate())} ${pad(k.getUTCHours())}:${pad(k.getUTCMinutes())}`;
    p.utcLabel = `${d.getUTCFullYear()}.${pad(d.getUTCMonth() + 1)}.${pad(d.getUTCDate())} ${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())} (UTC)`;
    p.lines = [];
    let sec = '';
    p.body.split('\n').forEach((raw, i) => {
      const h = raw.match(/^(#{2,3}) (.*)$/);
      if (h) sec = h[2];
      const text = plain(raw);
      if (text) p.lines.push({ i, sec: h ? '' : sec, text });
    });
    p.titleLow = p.title.toLowerCase();
  }

  // ---- 언어 전환: 화면 문구 + 글 개수
  function catLabel(c) {
    return (T[state.lang] && T[state.lang][CAT_KEY[c]]) || (data && data.cats[c]) || T['en-US'][CAT_KEY[c]];
  }
  function applyLang() {
    const t = tr();
    const mine = data ? data.posts : [];
    document.documentElement.lang = state.lang;
    document.title = t.title;
    document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t[el.dataset.t]; });
    document.querySelectorAll('[data-count]').forEach(el => {
      const c = el.dataset.count;
      if (c) el.previousElementSibling.textContent = catLabel(c);
      el.textContent = mine.filter(p => !c || p.cat === c).length;
    });
    langEl.value = state.lang;
    qEl.placeholder = t.placeholder;
    document.getElementById('foot').innerHTML = t.foot(state.lang);
    document.getElementById('meta').textContent = mine.length
      ? t.meta(mine.reduce((a, p) => p.kst > a ? p.kst : a, ''), checkedKst())
      : (data === undefined ? '' : t.noData);
  }

  // ---- 마지막 갱신 시각: 수집기가 매번 쓰는 data/meta.js. 캐시로 옛 시각이 보이지 않게 매번 새로 받는다
  function checkedKst() {
    const m = window.NOTICE_META;
    if (!m || !m.checked) return '';
    const k = new Date(new Date(m.checked).getTime() + 9 * 3600 * 1000);
    return `${k.getUTCFullYear()}.${pad(k.getUTCMonth() + 1)}.${pad(k.getUTCDate())} ${pad(k.getUTCHours())}:${pad(k.getUTCMinutes())}`;
  }
  const metaScript = document.createElement('script');
  metaScript.src = `data/meta.js?t=${Date.now()}`;
  metaScript.onload = () => applyLang();
  document.head.appendChild(metaScript);

  function plain(s) {
    return s.replace(/^#{2,3} /, '').replace(/^\s*(?:-|\d+\.) /, '')
      .replace(/\*\*/g, '').replace(/!\[\]\([^)]*\)/g, '').replace(/\[([^\]]*)\]\([^)]*\)/g, '$1').trim();
  }
  function esc(s) {
    return s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  }

  // ---- 검색어 해석: 띄어 쓴 단어가 같은 줄에 모두 있어야 일치
  function parse(q) {
    return q.toLowerCase().split(/\s+/).filter(Boolean);
  }
  function highlight(text, terms) {
    if (!terms.length) return esc(text);
    const low = text.toLowerCase();
    const marks = new Array(text.length).fill(false);
    terms.forEach(t => {
      let at = low.indexOf(t);
      while (at !== -1) { for (let j = at; j < at + t.length; j++) marks[j] = true; at = low.indexOf(t, at + 1); }
    });
    let out = '', on = false;
    for (let j = 0; j < text.length; j++) {
      if (marks[j] && !on) { out += '<mark>'; on = true; }
      if (!marks[j] && on) { out += '</mark>'; on = false; }
      out += esc(text[j]);
    }
    return out + (on ? '</mark>' : '');
  }

  // ---- 본문 렌더링 (수집기가 만든 단순 마크다운)
  function inlineMd(s) {
    let h = esc(s);
    h = h.replace(/!\[\]\(([^)]*)\)/g, '<a href="$1" target="_blank">' + tr().img + '</a>');
    h = h.replace(/\[([^\]]*)\]\((https?:[^)]*)\)/g, '<a href="$2" target="_blank">$1</a>');
    h = h.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
    return h;
  }
  // 이미 HTML로 바뀐 문자열에서 태그 밖 텍스트에만 하이라이트
  function markHtml(html, terms) {
    return html.split(/(<[^>]+>)/).map(part => {
      if (part.startsWith('<')) return part;
      const tmp = document.createElement('textarea');
      tmp.innerHTML = part;
      return highlight(tmp.value, terms);
    }).join('');
  }
  function renderBody(p, terms) {
    const out = [];
    let table = null;
    const hl = s => terms.length ? markHtml(inlineMd(s), terms) : inlineMd(s);
    p.body.split('\n').forEach((raw, i) => {
      if (/^\|/.test(raw)) {
        if (/^\|( --- \|)+$/.test(raw)) return;
        if (!table) { table = []; out.push(table); }
        table.push(raw.slice(1, -1).split(' | ').map(c => c.trim()));
        return;
      }
      table = null;
      if (!raw.trim()) return;
      let m;
      if ((m = raw.match(/^## (.*)/))) out.push(`<h2 data-i="${i}">${hl(m[1])}</h2>`);
      else if ((m = raw.match(/^### (.*)/))) out.push(`<h3 data-i="${i}">${hl(m[1])}</h3>`);
      else if ((m = raw.match(/^( *)(?:-|\d+\.) (.*)/))) out.push(`<li class="d${Math.min(3, m[1].length / 2)}" data-i="${i}">${hl(m[2])}</li>`);
      else out.push(`<p data-i="${i}">${hl(raw)}</p>`);
    });
    return out.map(x => Array.isArray(x)
      ? '<table>' + x.map(r => '<tr>' + r.map(c => `<td>${inlineMd(c)}</td>`).join('') + '</tr>').join('') + '</table>'
      : x).join('');
  }

  // ---- 상태
  const state = { q: '', cat: '', sort: 'desc', lang: 'ko-KR' };
  const qEl = document.getElementById('q');
  const listEl = document.getElementById('list');
  const sumEl = document.getElementById('summary');
  const sortEl = document.getElementById('sort');
  const langEl = document.getElementById('lang');
  langEl.innerHTML = LANGS.map(([loc, name]) => `<option value="${loc}">${name}</option>`).join('');
  const toLoc = v => ALIAS[v] || (LANGS.some(([loc]) => loc === v) ? v : null);

  function readHash() {
    const h = new URLSearchParams(location.hash.slice(1));
    state.q = h.get('q') || '';
    state.cat = h.get('cat') || '';
    state.sort = h.get('sort') === 'asc' ? 'asc' : 'desc';
    let saved = null;
    try { saved = localStorage.getItem('notice-search-lang'); } catch (e) {}
    state.lang = toLoc(h.get('lang')) || toLoc(saved) || 'ko-KR';
    qEl.value = state.q;
    syncControls();
  }
  function writeHash() {
    const h = new URLSearchParams();
    if (state.q) h.set('q', state.q);
    if (state.cat) h.set('cat', state.cat);
    if (state.sort === 'asc') h.set('sort', 'asc');
    if (state.lang !== 'ko-KR') h.set('lang', SHORT[state.lang] || state.lang);
    const s = h.toString();
    history.replaceState(null, '', s ? '#' + s : location.pathname + location.search);
  }
  function syncControls() {
    document.querySelectorAll('[data-cat]').forEach(c => c.classList.toggle('on', c.dataset.cat === state.cat));
    sortEl.textContent = tr()[state.sort];
  }

  // 언어를 바꾸면 그 언어 파일을 불러온 뒤 다시 그린다. 불러오는 사이 다른 언어로 바꾸면 늦게 온 결과는 버린다
  function switchLang() {
    const loc = state.lang;
    data = undefined;
    applyLang();
    listEl.innerHTML = '';
    sumEl.textContent = '';
    load(loc).then(d => {
      if (state.lang !== loc) return;
      data = d;
      applyLang();
      render();
    });
  }

  function render() {
    if (!data) return;
    const inc = parse(state.q);
    const t = tr();
    const pool = data.posts.filter(p => !state.cat || p.cat === state.cat)
      .sort((a, b) => state.sort === 'asc' ? a.utc.localeCompare(b.utc) : b.utc.localeCompare(a.utc));

    const results = [];
    let hitCount = 0;
    pool.forEach(p => {
      if (!inc.length) { results.push({ p, hits: [] }); return; }
      const ok = t => inc.every(x => t.includes(x));
      const hits = p.lines.filter(l => ok(l.text.toLowerCase()));
      if (hits.length || ok(p.titleLow)) { results.push({ p, hits }); hitCount += hits.length; }
    });

    sumEl.textContent = inc.length
      ? t.sumHit(results.length, hitCount)
      : t.sumAll(results.length);
    if (!results.length) {
      listEl.innerHTML = `<div class="empty">${t.empty}</div>`;
      return;
    }

    listEl.innerHTML = results.map(({ p, hits }, idx) => {
      const hitHtml = hits.length ? `<div class="hits">` +
        hits.slice(0, MAX_HITS).map(l =>
          `<div class="hit" data-line="${l.i}"><span class="sec" title="${esc(l.sec)}">${esc(l.sec)}</span><span class="line">${highlight(l.text, inc)}</span></div>`
        ).join('') +
        (hits.length > MAX_HITS ? `<div class="more">${t.more(hits.length - MAX_HITS)}</div>` : '') +
        `</div>` : '';
      return `<div class="post" data-idx="${idx}">
        <div class="row">
          <span class="date" title="${t.orig}: ${p.utcLabel}">${p.kst}</span>
          <span class="cat ${p.cat === '업데이트' ? 'upd' : ''}">${esc(catLabel(p.cat))}</span>
          <span class="title">${highlight(p.title, inc)}</span>
          <a class="src" href="${SITE}/${p.lang}/News/Notice/Detail?_boardNo=${p.no}" target="_blank">${t.src}</a>
        </div>${hitHtml}<div class="body"></div></div>`;
    }).join('');

    listEl.querySelectorAll('.post').forEach(el => {
      const { p } = results[+el.dataset.idx];
      const open = lineNo => {
        const body = el.querySelector('.body');
        if (!body.innerHTML) body.innerHTML = renderBody(p, inc);
        if (lineNo == null) { el.classList.toggle('open'); return; }
        el.classList.add('open');
        const target = body.querySelector(`[data-i="${lineNo}"]`);
        if (target) {
          target.scrollIntoView({ block: 'center', behavior: 'smooth' });
          target.classList.add('flash');
          setTimeout(() => target.classList.remove('flash'), 1200);
        }
      };
      el.querySelector('.row').addEventListener('click', e => { if (!e.target.closest('a')) open(null); });
      el.querySelectorAll('.hit').forEach(h => h.addEventListener('click', () => open(+h.dataset.line)));
    });
  }

  let timer;
  qEl.addEventListener('input', () => {
    clearTimeout(timer);
    timer = setTimeout(() => { state.q = qEl.value.trim(); writeHash(); render(); }, 150);
  });
  document.querySelectorAll('[data-cat]').forEach(c => c.addEventListener('click', () => {
    state.cat = c.dataset.cat; syncControls(); writeHash(); render();
  }));
  sortEl.addEventListener('click', () => {
    state.sort = state.sort === 'asc' ? 'desc' : 'asc'; syncControls(); writeHash(); render();
  });
  langEl.addEventListener('change', () => {
    state.lang = langEl.value;
    try { localStorage.setItem('notice-search-lang', state.lang); } catch (e) {}
    syncControls(); writeHash(); switchLang();
  });
  window.addEventListener('hashchange', () => {
    const before = state.lang;
    readHash();
    if (state.lang !== before) switchLang(); else { applyLang(); render(); }
  });

  readHash();
  switchLang();
})();
</script>
</body>
</html>
